# Publica la web en GitHub Pages cada vez que se hace push a main.
# Antes de publicar regenera data/canciones.json, así que basta con
# añadir una canción (un .tab o un MusicXML) y hacer push.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar índice de canciones
        run: python3 herramientas/generar_indice.py
      - name: Versionar archivos (que el navegador no use copias viejas)
        run: python3 herramientas/versionar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
      # Si existe el secreto CF_HOOK_PRIVADO (deploy hook de Cloudflare Pages), avisa al sitio
      # privado para que se reconstruya con esta versión de la app.
      - name: Reconstruir el sitio privado
        env:
          HOOK: ${{ secrets.CF_HOOK_PRIVADO }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "Sitio privado avisado"; else echo "Sin sitio privado configurado"; fi
